name: Build Workflow

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Build App
        run: |
          mv Throne.app TRN.app

      - name: Save Artifacts
        uses: actions/upload-artifact@v2
        with:
          name: TRN-app
          path: TRN.app
